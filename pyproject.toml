[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-options-trader"
version = "0.1.0"
description = "Personal quant trading platform: backtesting, paper trading, and an E*TRADE live-broker skeleton"
requires-python = ">=3.10"
dependencies = [
    "openbb==4.7.2",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "hmmlearn==0.3.3",
    "statsmodels==0.14.6",
    "Flask==3.1.3",
    "Flask-CORS==6.0.2",
    "Werkzeug==3.1.8",
    "plotly==6.7.0",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "requests-oauthlib==2.0.0",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.15",
    "mypy==2.1.0",
]
# Optional ML models ('lightgbm'/'stacking'/'mlp'/'lstm' walk-forward
# models). macOS also needs the OpenMP runtime for lightgbm:
# `brew install libomp`.
#
# torch lives ONLY in this extra (never in the base requirements.txt): the
# CPU/MPS wheel is hundreds of MB, so keeping it optional keeps the Docker
# image lean. The neural models ('mlp'/'lstm') import-guard torch and
# degrade gracefully when it is absent, so the base install is unaffected.
ai = [
    "lightgbm==4.6.0",
    "torch==2.12.1",
]

[tool.setuptools.packages.find]
include = ["core*", "data*", "brokers*", "portfolio*", "backtesting*", "strategies*", "desks*", "utils*", "gui*"]
exclude = ["readme*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Default rule set (pyflakes F + pycodestyle E/W) is enough; ruff auto-excludes
# .gitignore'd paths (.venv, build artifacts).
target-version = "py310"
line-length = 100

[tool.mypy]
# Scoped to the money path (brokers/ + execution/) — the rest of the tree is
# untyped and would only add noise. Third-party stubs are frequently absent
# for the data/quant deps, so missing imports are ignored.
files = ["brokers", "execution"]
ignore_missing_imports = true
