{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="bi bi-cash-flow"></i> Paper Trading</h2>
        <p class="text-muted">Trade with simulated money in real-time</p>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Create Trader</h5>
            </div>
            <div class="card-body">
                <form id="createTraderForm">
                    <div class="mb-3">
                        <label class="form-label">Trader ID</label>
                        <input type="text" class="form-control" id="traderId" placeholder="trader1" value="trader1">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Initial Capital ($)</label>
                        <input type="number" class="form-control" id="traderCapital" value="50000">
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-plus-circle"></i> Create Trader
                    </button>
                </form>
            </div>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0">Place Order</h5>
            </div>
            <div class="card-body">
                <form id="orderForm">
                    <div class="mb-3">
                        <label class="form-label">Symbol</label>
                        <input type="text" class="form-control" id="orderSymbol" placeholder="AAPL" value="AAPL">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Action</label>
                        <select class="form-select" id="orderAction">
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" id="orderQuantity" value="100">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Price ($)</label>
                        <input type="number" class="form-control" id="orderPrice" step="0.01" value="150.00">
                    </div>
                    
                    <button type="submit" class="btn btn-info w-100">
                        <i class="bi bi-arrow-repeat"></i> Place Order
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div id="portfolioContainer"></div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentTraderId = null;

document.getElementById('createTraderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const traderId = document.getElementById('traderId').value;
    const capital = document.getElementById('traderCapital').value;
    
    try {
        const response = await fetch('/api/paper_trader/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({trader_id: traderId, initial_capital: capital})
        });
        
        const data = await response.json();
        currentTraderId = traderId;
        showAlert('Trader created successfully!', 'success');
        updatePortfolio();
    } catch (error) {
        showAlert(`Error: ${error.message}`, 'danger');
    }
});

document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!currentTraderId) {
        showAlert('Please create a trader first', 'warning');
        return;
    }
    
    const symbol = document.getElementById('orderSymbol').value;
    const action = document.getElementById('orderAction').value;
    const quantity = document.getElementById('orderQuantity').value;
    const price = document.getElementById('orderPrice').value;
    
    try {
        const response = await fetch(`/api/paper_trader/${currentTraderId}/order`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({symbol, action, quantity, price})
        });
        
        const data = await response.json();
        showAlert(`Order placed: ${data.order_id}`, 'success');
        updatePortfolio();
    } catch (error) {
        showAlert(`Error: ${error.message}`, 'danger');
    }
});

async function updatePortfolio() {
    if (!currentTraderId) return;
    
    try {
        const response = await fetch(`/api/paper_trader/${currentTraderId}/status`);
        const data = await response.json();
        
        const container = document.getElementById('portfolioContainer');
        container.innerHTML = `
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Portfolio Status</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Summary</h6>
                            <table class="table table-sm">
                                <tr>
                                    <td><strong>Cash:</strong></td>
                                    <td>$${parseFloat(data.cash).toFixed(2)}</td>
                                </tr>
                                <tr>
                                    <td><strong>Portfolio Value:</strong></td>
                                    <td>$${parseFloat(data.portfolio_value).toFixed(2)}</td>
                                </tr>
                                <tr>
                                    <td><strong>Unrealized P&L:</strong></td>
                                    <td><span class="badge ${data.unrealized_pnl >= 0 ? 'bg-success' : 'bg-danger'}">${parseFloat(data.unrealized_pnl).toFixed(2)}</span></td>
                                </tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>Status</h6>
                            <p><strong>Positions:</strong> ${data.positions.length}</p>
                            <p><strong>Pending Orders:</strong> ${data.pending_orders}</p>
                        </div>
                    </div>
                </div>
            </div>
            
            ${data.positions.length > 0 ? `
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Open Positions</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Quantity</th>
                                    <th>Entry Price</th>
                                    <th>Current Price</th>
                                    <th>P&L</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.positions.map(pos => `
                                    <tr>
                                        <td>${pos.symbol}</td>
                                        <td>${pos.quantity}</td>
                                        <td>$${parseFloat(pos.entry_price).toFixed(2)}</td>
                                        <td>$${parseFloat(pos.current_price).toFixed(2)}</td>
                                        <td><span class="badge ${pos.pnl >= 0 ? 'bg-success' : 'bg-danger'}">${parseFloat(pos.pnl).toFixed(2)}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            ` : '<div class="alert alert-info">No open positions</div>'}
        `;
    } catch (error) {
        showAlert(`Error: ${error.message}`, 'danger');
    }
}

// Auto-update every 5 seconds
setInterval(updatePortfolio, 5000);
</script>
{% endblock %}
