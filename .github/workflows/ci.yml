name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # uv resolves + installs the heavy scientific/openbb stack far faster than
      # pip and caches it across runs.
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install dependencies
        # requirements.txt is the runtime source of truth (matches the Docker
        # image); .[dev] adds the lint/type/test tooling. torch (the [ai] extra)
        # is intentionally omitted — the neural-model tests import-guard it and
        # skip, keeping CI fast.
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check money path (mypy on brokers/ + execution/)
        run: mypy

      - name: Tests + coverage
        # -n auto: pytest-xdist fans the suite across the runner's cores (it is
        # parallel-safe — every test uses tmp_path / per-test dbs). sysmon: the
        # fast sys.monitoring coverage backend (Python 3.13) cuts the tracing tax.
        env:
          COVERAGE_CORE: sysmon
        run: pytest -n auto --cov=. --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        # Validates the Dockerfile and that requirements.txt installs cleanly
        # in the slim runtime image.
        run: docker build -t stockoptionstrader:ci .
